<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKNET — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ============ CONFIG ============ -->
<!-- Same Supabase project URL + anon/public key as index.html -->
<script>
  const SUPABASE_URL = 'https://kvnqdoiwsofewovtjoma.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Wu1SP-hGRSVgopENn8o5nA_JxPfN9VL';

  // Default email shown on the login screen. The password itself is NOT
  // stored here — it's whatever you set for this user in Supabase
  // Dashboard → Authentication → Users (see schema.sql for setup notes).
  // Suggested login: admin@darknet.local / darknet@123
  const ADMIN_EMAIL_HINT = 'admin@darknet.local';
</script>
<style>
  :root{
    --bg:#050805; --bg-panel:#0c130d; --bg-panel-2:#101a11;
    --amber:#00ff66; --amber-dim:#0a9b45; --amber-faint:#0e3319;
    --paper:#d7f5df; --paper-dim:#7fa88c; --line:#1a2e1d; --red:#ff5a3c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--paper); font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .display{font-family:'Big Shoulders Display', sans-serif; font-weight:800; letter-spacing:0.01em;}
  a{color:inherit;}
  ::selection{background:var(--amber); color:#0b0d0a;}
  button, input, select, textarea{font-family:inherit;}

  /* ---------- login screen ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    width:100%; max-width:380px; border:1px solid var(--line); background:var(--bg-panel); padding:32px;
  }
  .login-box .eyebrow{font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:var(--amber); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .login-box .eyebrow .dot{width:6px; height:6px; background:var(--amber); border-radius:50%; box-shadow:0 0 8px var(--amber);}
  .login-box h1{font-size:32px; text-transform:uppercase; margin-bottom:6px;}
  .login-box p.sub{color:var(--paper-dim); font-size:12.5px; margin-bottom:24px; line-height:1.6;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--paper-dim); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--paper);
    padding:11px 12px; font-size:14px; outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{
    width:100%; background:var(--amber); color:#0b0d0a; border:none; padding:12px;
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; cursor:pointer;
    transition:opacity .15s;
  }
  .btn:hover{opacity:0.85;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn.ghost{background:transparent; border:1px solid var(--amber-dim); color:var(--amber);}
  .btn.danger{background:var(--red); color:#1a0b06;}
  .btn.small{width:auto; padding:8px 14px; font-size:11px;}
  .error-msg{
    background:rgba(255,90,60,0.1); border:1px solid var(--red); color:var(--red);
    padding:10px 12px; font-size:12px; margin-bottom:16px; display:none;
  }

  /* ---------- dashboard shell ---------- */
  #dash{display:none;}
  header.admin-top{
    display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(5,8,5,0.95); z-index:50;
  }
  .logo{display:flex; align-items:center; gap:10px;}
  .logo .mark{width:30px; height:30px; border:1.5px solid var(--amber); display:flex; align-items:center; justify-content:center; color:var(--amber); font-weight:700;}
  .logo .word{font-size:17px; letter-spacing:0.02em;}
  .logo .word b{color:var(--amber);}
  .logo .word small{color:var(--paper-dim); font-weight:400; font-size:11px; letter-spacing:0.1em; margin-left:6px;}
  .top-actions{display:flex; align-items:center; gap:14px;}
  .who{font-size:11.5px; color:var(--paper-dim);}

  nav.tabs{display:flex; gap:4px; padding:0 28px; border-bottom:1px solid var(--line); background:var(--bg-panel-2);}
  nav.tabs button{
    background:transparent; border:none; color:var(--paper-dim); padding:14px 18px; font-size:12px;
    text-transform:uppercase; letter-spacing:0.08em; cursor:pointer; border-bottom:2px solid transparent;
  }
  nav.tabs button.active{color:var(--amber); border-bottom-color:var(--amber);}

  main{padding:28px; max-width:1200px; margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .panel-head h2{font-size:22px; text-transform:uppercase;}
  .muted{color:var(--paper-dim); font-size:12px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--paper-dim);
    border-bottom:1px solid var(--line); padding:8px 10px;
  }
  tbody td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:hover{background:var(--bg-panel);}
  .pill{display:inline-block; padding:3px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; border:1px solid var(--amber-dim); color:var(--amber);}
  .pill.off{border-color:var(--line); color:var(--paper-dim);}
  .pill.pending{border-color:#c9a227; color:#e6c34d;}
  .pill.paid{border-color:var(--amber-dim); color:var(--amber);}
  .pill.shipped{border-color:#4affe0; color:#4affe0;}
  .pill.cancelled{border-color:var(--red); color:var(--red);}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .row-actions button{
    background:transparent; border:1px solid var(--line); color:var(--paper-dim); padding:5px 10px;
    font-size:10.5px; text-transform:uppercase; cursor:pointer; letter-spacing:0.04em;
  }
  .row-actions button:hover{border-color:var(--amber); color:var(--amber);}
  .row-actions button.danger:hover{border-color:var(--red); color:var(--red);}

  /* product form modal */
  .overlay{position:fixed; inset:0; background:rgba(2,4,2,0.75); display:none; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .overlay.open{display:flex;}
  .modal{width:100%; max-width:560px; max-height:88vh; overflow:auto; background:var(--bg-panel); border:1px solid var(--line); padding:26px;}
  .modal h3{font-size:20px; text-transform:uppercase; margin-bottom:18px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .field small.hint{display:block; color:var(--paper-dim); font-size:10.5px; margin-top:4px;}
  select{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--paper); padding:11px 12px; font-size:14px;}
  textarea{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--paper); padding:11px 12px; font-size:13px; resize:vertical;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .specs-row{display:flex; gap:8px; margin-bottom:8px;}
  .specs-row input{flex:1;}
  .specs-row button{background:transparent; border:1px solid var(--line); color:var(--red); cursor:pointer; padding:0 12px;}

  .empty-state{padding:40px; text-align:center; color:var(--paper-dim); border:1px dashed var(--line);}
  .loading{color:var(--paper-dim); font-size:12px; padding:20px 0;}

  .order-items-list{font-size:11.5px; color:var(--paper-dim); margin-top:4px;}
  .order-items-list div{padding:1px 0;}

  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    table, thead, tbody, tr, td, th{display:block;}
    thead{display:none;}
    tbody tr{border:1px solid var(--line); margin-bottom:10px; padding:6px;}
    tbody td{border-bottom:none; display:flex; justify-content:space-between; gap:10px;}
    tbody td::before{content:attr(data-label); color:var(--paper-dim); font-size:10px; text-transform:uppercase;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="eyebrow"><span class="dot"></span> RESTRICTED ACCESS</div>
    <h1 class="display">Admin<b style="color:var(--amber)">.</b></h1>
    <p class="sub">Sign in with the store's Supabase admin account to manage products and orders.</p>
    <div id="loginError" class="error-msg"></div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dash">
  <header class="admin-top">
    <div class="logo">
      <div class="mark">▲</div>
      <div class="word"><b>DARK</b>NET <small>ADMIN</small></div>
    </div>
    <div class="top-actions">
      <span class="who" id="whoAmI"></span>
      <button class="btn ghost small" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </nav>

  <main>
    <!-- PRODUCTS -->
    <section class="panel active" id="panel-products">
      <div class="panel-head">
        <h2>Products</h2>
        <button class="btn small" id="newProductBtn">+ New product</button>
      </div>
      <div id="productsTableWrap" class="loading">Loading products…</div>
    </section>

    <!-- ORDERS -->
    <section class="panel" id="panel-orders">
      <div class="panel-head">
        <h2>Orders</h2>
        <button class="btn ghost small" id="refreshOrdersBtn">Refresh</button>
      </div>
      <div id="ordersTableWrap" class="loading">Loading orders…</div>
    </section>
  </main>
</div>

<!-- ============ PRODUCT FORM MODAL ============ -->
<div class="overlay" id="productOverlay">
  <div class="modal">
    <h3 id="productModalTitle">New product</h3>
    <form id="productForm">
      <input type="hidden" id="p_original_id">
      <div class="form-grid">
        <div class="field full">
          <label>ID / SKU (lowercase, no spaces)</label>
          <input type="text" id="p_id" required pattern="[a-z0-9\-]+" placeholder="e.g. flipper-zero">
        </div>
        <div class="field full">
          <label>Name</label>
          <input type="text" id="p_name" required>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="p_category">
            <option value="rf">RF / Wireless</option>
            <option value="rfid">RFID / NFC</option>
            <option value="embedded">Embedded</option>
            <option value="network">Network</option>
          </select>
        </div>
        <div class="field">
          <label>Price (INR)</label>
          <input type="number" id="p_price" min="0" required>
        </div>
        <div class="field">
          <label>Tag (optional)</label>
          <input type="text" id="p_tag" placeholder="NEW, BESTSELLER…">
        </div>
        <div class="field">
          <label>Glyph (fallback icon)</label>
          <input type="text" id="p_glyph" maxlength="2" placeholder="◆">
        </div>
        <div class="field full">
          <label>Image URL (optional)</label>
          <input type="text" id="p_image_url" placeholder="https://…">
        </div>
        <div class="field full">
          <label>Description</label>
          <textarea id="p_desc" rows="3"></textarea>
        </div>
        <div class="field full">
          <label>Specs</label>
          <div id="specsRows"></div>
          <button type="button" class="btn ghost small" id="addSpecRow">+ Add spec row</button>
        </div>
        <div class="field full">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="p_active" style="width:auto;" checked> Active (visible on storefront)
          </label>
        </div>
      </div>
      <div id="productFormError" class="error-msg"></div>
      <div class="modal-actions">
        <button type="submit" class="btn" id="saveProductBtn">Save product</button>
        <button type="button" class="btn ghost" id="cancelProductBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
document.getElementById('loginEmail').value = ADMIN_EMAIL_HINT;

/* ---------------- AUTH ---------------- */
const loginScreen = document.getElementById('loginScreen');
const dash = document.getElementById('dash');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');

function showLoginError(msg){
  loginError.textContent = msg;
  loginError.style.display = 'block';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { data, error } = await client.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = 'Sign in';
  if (error){
    showLoginError(error.message || 'Sign in failed.');
    return;
  }
  enterDashboard(data.user);
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await client.auth.signOut();
  dash.style.display = 'none';
  loginScreen.style.display = 'flex';
  document.getElementById('loginPassword').value = '';
});

async function enterDashboard(user){
  loginScreen.style.display = 'none';
  dash.style.display = 'block';
  document.getElementById('whoAmI').textContent = user?.email || '';
  loadProducts();
  loadOrders();
}

// Restore session on reload
(async function initSession(){
  const { data } = await client.auth.getSession();
  if (data.session){
    enterDashboard(data.session.user);
  }
})();

/* ---------------- TABS ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function money(n){ return '₹' + Number(n || 0).toLocaleString('en-IN'); }

/* ---------------- PRODUCTS ---------------- */
let productsCache = [];

async function loadProducts(){
  const wrap = document.getElementById('productsTableWrap');
  wrap.innerHTML = '<div class="loading">Loading products…</div>';
  const { data, error } = await client.from('products').select('*').order('created_at');
  if (error){
    wrap.innerHTML = `<div class="empty-state">Could not load products: ${escapeHtml(error.message)}</div>`;
    return;
  }
  productsCache = data || [];
  if (!productsCache.length){
    wrap.innerHTML = '<div class="empty-state">No products yet — add your first one.</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${productsCache.map(p => `
          <tr>
            <td data-label="SKU">${escapeHtml(p.id)}</td>
            <td data-label="Name">${escapeHtml(p.name)}</td>
            <td data-label="Category">${escapeHtml(p.category)}</td>
            <td data-label="Price">${money(p.price)}</td>
            <td data-label="Status"><span class="pill ${p.active ? '' : 'off'}">${p.active ? 'Active' : 'Hidden'}</span></td>
            <td data-label="Actions">
              <div class="row-actions">
                <button data-edit="${escapeHtml(p.id)}">Edit</button>
                <button data-toggle="${escapeHtml(p.id)}">${p.active ? 'Hide' : 'Show'}</button>
                <button class="danger" data-delete="${escapeHtml(p.id)}">Delete</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProductForm(b.dataset.edit)));
  wrap.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => toggleActive(b.dataset.toggle)));
  wrap.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteProduct(b.dataset.delete)));
}

async function toggleActive(id){
  const p = productsCache.find(x => x.id === id);
  if (!p) return;
  const { error } = await client.from('products').update({ active: !p.active }).eq('id', id);
  if (error) return alert('Could not update: ' + error.message);
  loadProducts();
}

async function deleteProduct(id){
  if (!confirm(`Delete "${id}"? This can't be undone.`)) return;
  const { error } = await client.from('products').delete().eq('id', id);
  if (error) return alert('Could not delete: ' + error.message);
  loadProducts();
}

/* ---- product form modal ---- */
const productOverlay = document.getElementById('productOverlay');
const productForm = document.getElementById('productForm');
const productFormError = document.getElementById('productFormError');
const specsRows = document.getElementById('specsRows');

function addSpecRow(label='', value=''){
  const row = document.createElement('div');
  row.className = 'specs-row';
  row.innerHTML = `
    <input type="text" placeholder="Label (e.g. Radio)" value="${escapeHtml(label)}">
    <input type="text" placeholder="Value (e.g. Sub-1GHz)" value="${escapeHtml(value)}">
    <button type="button" title="Remove">×</button>
  `;
  row.querySelector('button').addEventListener('click', () => row.remove());
  specsRows.appendChild(row);
}
document.getElementById('addSpecRow').addEventListener('click', () => addSpecRow());

function openProductForm(id){
  productFormError.style.display = 'none';
  specsRows.innerHTML = '';
  const p = id ? productsCache.find(x => x.id === id) : null;
  document.getElementById('productModalTitle').textContent = p ? 'Edit product' : 'New product';
  document.getElementById('p_original_id').value = p ? p.id : '';
  document.getElementById('p_id').value = p ? p.id : '';
  document.getElementById('p_id').disabled = !!p; // don't let id change on edit (it's the primary key + used in past orders)
  document.getElementById('p_name').value = p ? p.name : '';
  document.getElementById('p_category').value = p ? p.category : 'rf';
  document.getElementById('p_price').value = p ? p.price : '';
  document.getElementById('p_tag').value = p ? (p.tag || '') : '';
  document.getElementById('p_glyph').value = p ? (p.glyph || '◆') : '◆';
  document.getElementById('p_image_url').value = p ? (p.image_url || '') : '';
  document.getElementById('p_desc').value = p ? (p.description || '') : '';
  document.getElementById('p_active').checked = p ? !!p.active : true;
  const specs = (p && Array.isArray(p.specs)) ? p.specs : [];
  if (specs.length){
    specs.forEach(s => addSpecRow(s[0], s[1]));
  } else {
    addSpecRow(); addSpecRow(); addSpecRow();
  }
  productOverlay.classList.add('open');
}

document.getElementById('newProductBtn').addEventListener('click', () => openProductForm(null));
document.getElementById('cancelProductBtn').addEventListener('click', () => productOverlay.classList.remove('open'));
productOverlay.addEventListener('click', (e) => { if (e.target === productOverlay) productOverlay.classList.remove('open'); });

productForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  productFormError.style.display = 'none';

  const originalId = document.getElementById('p_original_id').value;
  const id = document.getElementById('p_id').value.trim();
  const specs = Array.from(specsRows.children).map(row => {
    const inputs = row.querySelectorAll('input');
    return [inputs[0].value.trim(), inputs[1].value.trim()];
  }).filter(s => s[0] || s[1]);

  const payload = {
    id,
    name: document.getElementById('p_name').value.trim(),
    category: document.getElementById('p_category').value,
    price: Number(document.getElementById('p_price').value),
    tag: document.getElementById('p_tag').value.trim(),
    glyph: document.getElementById('p_glyph').value.trim() || '◆',
    image_url: document.getElementById('p_image_url').value.trim(),
    description: document.getElementById('p_desc').value.trim(),
    active: document.getElementById('p_active').checked,
    specs,
  };

  const saveBtn = document.getElementById('saveProductBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  let error;
  if (originalId){
    ({ error } = await client.from('products').update(payload).eq('id', originalId));
  } else {
    ({ error } = await client.from('products').insert(payload));
  }

  saveBtn.disabled = false;
  saveBtn.textContent = 'Save product';

  if (error){
    productFormError.textContent = error.message;
    productFormError.style.display = 'block';
    return;
  }
  productOverlay.classList.remove('open');
  loadProducts();
});

/* ---------------- ORDERS ---------------- */
async function loadOrders(){
  const wrap = document.getElementById('ordersTableWrap');
  wrap.innerHTML = '<div class="loading">Loading orders…</div>';
  const { data: orders, error } = await client
    .from('orders')
    .select('*, order_items(*)')
    .order('created_at', { ascending: false });
  if (error){
    wrap.innerHTML = `<div class="empty-state">Could not load orders: ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!orders || !orders.length){
    wrap.innerHTML = '<div class="empty-state">No orders yet.</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td data-label="Order">
              ${o.id.slice(0,8)}<br><span class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</span>
            </td>
            <td data-label="Customer">
              ${escapeHtml(o.customer_name)}<br><span class="muted">${escapeHtml(o.customer_email)} · ${escapeHtml(o.customer_phone)}</span><br>
              <span class="muted">${escapeHtml(o.shipping_address)}</span>
            </td>
            <td data-label="Items">
              <div class="order-items-list">
                ${(o.order_items || []).map(it => `<div>${it.quantity} × ${escapeHtml(it.product_name)}</div>`).join('')}
              </div>
            </td>
            <td data-label="Total">${money(o.total)}</td>
            <td data-label="Status"><span class="pill ${o.status}">${escapeHtml(o.status)}</span></td>
            <td data-label="Actions">
              <div class="row-actions">
                <select data-status="${o.id}">
                  ${['pending','paid','shipped','cancelled'].map(s => `<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
                </select>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('[data-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const { error } = await client.from('orders').update({ status: sel.value }).eq('id', sel.dataset.status);
      if (error){
        alert('Could not update status: ' + error.message);
        loadOrders();
      }
    });
  });
}
document.getElementById('refreshOrdersBtn').addEventListener('click', loadOrders);
</script>
</body>
</html>
