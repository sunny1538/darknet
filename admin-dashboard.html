<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Bindery — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#14201a; --ink-panel:#1b2a22; --paper:#f3ead9;
    --gold:#c9a24b; --gold-soft:#e2c887;
    --burgundy:#7d2e2e; --ok:#3a6b4a; --err:#a3402f;
    --text-muted:#93a596; --line:rgba(201,162,75,.18);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; }
  header{
    display:flex; align-items:center; justify-content:space-between; padding:20px 5vw;
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:32px; height:32px; border:1.5px solid var(--gold); border-radius:3px;
    display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif;
    font-weight:700; color:var(--gold); font-size:15px; transform:rotate(-2deg);
  }
  .brand-name{ font-family:'Playfair Display',serif; font-size:18px; }
  .brand-sub{ font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-soft); }
  #logout-btn{
    background:transparent; border:1px solid rgba(243,234,217,.3); color:var(--paper);
    padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; display:none;
  }
  #logout-btn:hover{ border-color:var(--gold); color:var(--gold-soft); }

  main{ max-width:1080px; margin:0 auto; padding:5vw; }

  /* ---- Login ---- */
  #login-section{ max-width:400px; margin:8vh auto; }
  .login-card{
    background:var(--paper); color:#2b2420; border-radius:10px; padding:36px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
  }
  .login-card h1{ font-family:'Playfair Display',serif; font-size:24px; margin:0 0 4px; }
  .login-card p{ margin:0 0 22px; font-size:13px; color:#6b6255; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:#6b6255; margin-bottom:6px; }
  .field input{
    width:100%; padding:11px 13px; border-radius:6px; border:1px solid #d8cba9;
    background:#fffdf8; font-size:14.5px; color:#2b2420;
  }
  .field input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .primary-btn{
    width:100%; padding:12px; border:none; border-radius:6px; background:var(--burgundy); color:#fff;
    font-size:14.5px; font-weight:600; cursor:pointer; margin-top:6px;
  }
  .primary-btn:hover{ background:#5f2020; }
  .primary-btn:disabled{ opacity:.6; cursor:wait; }
  .msg{ font-size:13px; margin-top:12px; padding:9px 12px; border-radius:6px; display:none; }
  .msg.show{ display:block; }
  .msg.err{ background:#fbe8e4; color:var(--err); }

  /* ---- Dashboard ---- */
  #panel-section{ display:none; }
  .panel-title{ font-family:'Playfair Display',serif; font-size:28px; margin:0 0 30px; }

  .stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:38px; }
  .stat-card{
    background:var(--ink-panel); border:1px solid var(--line); border-radius:10px; padding:20px;
  }
  .stat-card .label{ font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-muted); }
  .stat-card .value{ font-family:'Playfair Display',serif; font-size:26px; margin-top:8px; color:var(--gold-soft); }

  .section-block{ margin-bottom:44px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .section-head h2{ font-family:'Playfair Display',serif; font-size:19px; font-weight:600; margin:0; }
  .search-input{
    padding:8px 12px; border-radius:20px; border:1px solid var(--line); background:var(--ink-panel);
    color:var(--paper); font-size:12.5px; width:220px;
  }
  .search-input::placeholder{ color:var(--text-muted); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left; padding:10px 12px; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--text-muted); border-bottom:1px solid var(--line); font-weight:600;
  }
  tbody td{ padding:12px 12px; border-bottom:1px solid rgba(201,162,75,.08); vertical-align:middle; }
  tbody tr:hover{ background:rgba(201,162,75,.04); }
  .mono{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); }

  .status-pill{ padding:4px 11px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
  .status-pill.paid{ background:rgba(58,107,74,.25); color:#8fd3a4; }
  .status-pill.pending{ background:rgba(201,162,75,.2); color:var(--gold-soft); }
  .status-pill.failed{ background:rgba(163,64,47,.2); color:#e59a8b; }

  .status-select{
    background:var(--ink); color:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:5px 8px; font-size:12px; cursor:pointer;
  }

  .empty-row{ text-align:center; padding:30px; color:var(--text-muted); font-size:13px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">B</div>
    <div>
      <div class="brand-name">The Bindery</div>
      <div class="brand-sub">Admin Console</div>
    </div>
  </div>
  <button id="logout-btn">Sign out</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="login-section">
    <div class="login-card">
      <h1>Admin sign-in</h1>
      <p>Restricted to accounts flagged as admin in Supabase.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" />
      </div>
      <button class="primary-btn" id="login-btn">Sign in</button>
      <div class="msg" id="login-msg"></div>
    </div>
  </section>

  <!-- PANEL -->
  <section id="panel-section">
    <h1 class="panel-title">Overview</h1>

    <div class="stats-row">
      <div class="stat-card"><div class="label">Total users</div><div class="value" id="stat-users">—</div></div>
      <div class="stat-card"><div class="label">Paid orders</div><div class="value" id="stat-paid">—</div></div>
      <div class="stat-card"><div class="label">Pending orders</div><div class="value" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="label">Revenue</div><div class="value" id="stat-revenue">—</div></div>
    </div>

    <div class="section-block">
      <div class="section-head">
        <h2>Orders</h2>
        <input class="search-input" id="order-search" placeholder="Search by email…" />
      </div>
      <table>
        <thead>
          <tr><th>Date</th><th>Customer</th><th>Book</th><th>Amount</th><th>Payment ID</th><th>Status</th></tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>

    <div class="section-block">
      <div class="section-head">
        <h2>Users</h2>
        <input class="search-input" id="user-search" placeholder="Search by email…" />
      </div>
      <table>
        <thead>
          <tr><th>Joined</th><th>Name</th><th>Email</th><th>Admin</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>

</main>

<script>
  const SUPABASE_URL = "https://irivevwtwjhsaetfbmud.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xOeHwYm4Rh_W3Vn4P03qZg_aYT5rKsa";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allOrders = [];
  let allUsers = [];

  const loginSection = document.getElementById('login-section');
  const panelSection = document.getElementById('panel-section');
  const logoutBtn = document.getElementById('logout-btn');
  const loginBtn = document.getElementById('login-btn');
  const loginMsg = document.getElementById('login-msg');

  function showLoginMsg(text){
    loginMsg.textContent = text;
    loginMsg.className = 'msg show err';
  }

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password){ showLoginMsg('Enter both email and password.'); return; }

    loginBtn.disabled = true;
    loginMsg.className = 'msg';
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;

      const { data: profile, error: profErr } = await sb
        .from('profiles').select('is_admin').eq('id', data.user.id).single();
      if (profErr) throw profErr;

      if (!profile || !profile.is_admin){
        await sb.auth.signOut();
        showLoginMsg('This account is not an admin. Ask an existing admin to flag it in Supabase.');
        return;
      }
      await enterPanel();
    } catch (err) {
      showLoginMsg(err.message || 'Sign-in failed.');
    } finally {
      loginBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
    panelSection.style.display = 'none';
    logoutBtn.style.display = 'none';
    loginSection.style.display = 'block';
  });

  async function enterPanel(){
    loginSection.style.display = 'none';
    panelSection.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    await loadAll();
  }

  async function loadAll(){
    const { data: orders, error: oErr } = await sb
      .from('orders')
      .select('*, books(title), profiles(email, full_name)')
      .order('created_at', { ascending: false });
    if (oErr) console.error(oErr);
    allOrders = orders || [];

    const { data: users, error: uErr } = await sb
      .from('profiles')
      .select('*')
      .order('created_at', { ascending: false });
    if (uErr) console.error(uErr);
    allUsers = users || [];

    renderStats();
    renderOrders(allOrders);
    renderUsers(allUsers);
  }

  function renderStats(){
    document.getElementById('stat-users').textContent = allUsers.length;
    const paid = allOrders.filter(o => o.status === 'paid');
    const pending = allOrders.filter(o => o.status === 'pending');
    document.getElementById('stat-paid').textContent = paid.length;
    document.getElementById('stat-pending').textContent = pending.length;
    const revenue = paid.reduce((sum, o) => sum + Number(o.amount || 0), 0);
    document.getElementById('stat-revenue').textContent = '₹' + revenue.toLocaleString('en-IN');
  }

  function renderOrders(orders){
    const body = document.getElementById('orders-body');
    if (!orders.length){
      body.innerHTML = '<tr><td colspan="6" class="empty-row">No orders yet.</td></tr>';
      return;
    }
    body.innerHTML = orders.map(o => `
      <tr>
        <td>${new Date(o.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })}</td>
        <td>${o.profiles?.full_name || '—'}<br/><span class="mono">${o.profiles?.email || o.user_id}</span></td>
        <td>${o.books?.title || '—'}</td>
        <td>₹${o.amount}</td>
        <td class="mono">${o.razorpay_payment_id || '—'}</td>
        <td>
          <select class="status-select" data-order-id="${o.id}" onchange="updateOrderStatus(this)">
            <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>pending</option>
            <option value="paid" ${o.status === 'paid' ? 'selected' : ''}>paid</option>
            <option value="failed" ${o.status === 'failed' ? 'selected' : ''}>failed</option>
          </select>
        </td>
      </tr>
    `).join('');
  }

  function renderUsers(users){
    const body = document.getElementById('users-body');
    if (!users.length){
      body.innerHTML = '<tr><td colspan="4" class="empty-row">No users yet.</td></tr>';
      return;
    }
    body.innerHTML = users.map(u => `
      <tr>
        <td>${new Date(u.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })}</td>
        <td>${u.full_name || '—'}</td>
        <td class="mono">${u.email}</td>
        <td>${u.is_admin ? '<span class="status-pill paid">Admin</span>' : '—'}</td>
      </tr>
    `).join('');
  }

  // exposed globally for the inline onchange handler
  window.updateOrderStatus = async function(selectEl){
    const orderId = selectEl.dataset.orderId;
    const newStatus = selectEl.value;
    const { error } = await sb.from('orders').update({ status: newStatus }).eq('id', orderId);
    if (error){ alert('Could not update order: ' + error.message); return; }
    await loadAll();
  };

  document.getElementById('order-search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    renderOrders(allOrders.filter(o => (o.profiles?.email || '').toLowerCase().includes(q)));
  });
  document.getElementById('user-search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    renderUsers(allUsers.filter(u => (u.email || '').toLowerCase().includes(q)));
  });

  // Restore session on load
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session){
      const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).single();
      if (profile && profile.is_admin){
        await enterPanel();
      } else {
        await sb.auth.signOut();
      }
    }
  })();
</script>

</body>
</html>
